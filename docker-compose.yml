version: '3.8'

services:
  unifi-firewall-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unifi-firewall-manager
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  app-network:
    driver: bridge
