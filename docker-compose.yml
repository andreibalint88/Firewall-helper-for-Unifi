version: '3.8'

services:
  unifi-firewall-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unifi-firewall-manager
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:-change-this-to-a-secure-random-string-in-production}
      - DB_PATH=/app/data/users.db
    volumes:
      # Persist the SQLite database
      - unifi-fw-data:/app/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  unifi-fw-data:
    driver: local

networks:
  app-network:
    driver: bridge
